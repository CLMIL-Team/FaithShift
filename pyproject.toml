[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithshift"
version = "0.1.0"
description = "A stress-test protocol for faithfulness detectors under distribution shift."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.optional-dependencies]
experiment = ["torch>=2.1", "transformers>=4.45", "datasets>=2.19", "accelerate>=0.30", "vllm>=0.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
