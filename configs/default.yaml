# All paths are relative to the project root unless made absolute deliberately.
seed: 0
data_dir: data
output_dir: outputs

datasets:
  domains: [gsm8k, csqa, bbh]
  items_per_domain: 200

models:
  r1: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  qwen: Qwen/Qwen3-1.7B

generation:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 640
  gpu_memory_utilization: 0.80
  max_num_seqs: 64

extraction:
  device: cuda
  max_length: 1024

detector:
  epochs: 400
  learning_rate: 0.003
  weight_decay: 0.001
  irm_lambda: 100.0
  selective_risk: 0.25
